; Nightzim BoomMod X v1.0b - explosoes volumetricas para o DCS World
; Bombas, foguetes e misseis reais disparam as explosoes automaticamente.
; Cada explosao sai girada/espelhada ao acaso e deriva com o vento real da missao.
; Log: NightzimBoom.log nesta pasta

[camera]
vfov_deg=50
near_m=0.02
reversed_depth=1
flip_right=0
auto_calibrate=1
calibrate_every_frames=12

[render]
step_m=1.5
max_steps=420
exposure=1.0
opacity=1.0
; detalhe procedural (0 = desligado). escala em metros do ruido maior
detail=0.8
detail_scale_m=12
; fogo: ganho da emissao e temperatura minima da chama (menor = mais vermelho)
fire_gain=0.6
flame_min_temp_k=1450
; desvanecimento nas paredes da caixa do volume (fracao)
edge_fade=0.08
fog_dist_m=15000
fog_r=0.62
fog_g=0.68
fog_b=0.76
debug=0
depth_min_draws=20
; esconde a explosao atras da cabine (tudo a menos de 5 m da camera)
cockpit_mask=1

[explosion]
dist_jdam_m=600
dist_aerea_m=600
dist_pequena_m=200
dist_media_m=400
dist_napalm_m=400
dist_tanque_m=150
hold_s=24
fade_end_s=40
freeze_t=-1

[sun]
; usado so se o hook nao conseguir calcular o sol da missao
default_az_deg=120
default_el_deg=52

[wind]
; a fumaca deriva com o vento real da missao (medido 100 m acima do ponto da explosao)
enabled=1
gain=1.0
; ate essa altura a deriva cresce (perto do chao a poeira anda ~35% do vento)
shear_height_m=80
; segundos depois da detonacao ate a deriva comecar
delay_s=0.6

[shock]
; onda de choque (refracao do ar comprimido). gain multiplica tudo (0 = desligada)
gain=1.0
; forca por tipo (1.0 = referencia)
jdam=0.8
media=0.3
aerea=0.1
pequena=0.13
tanque=0.1
napalm=0
; nuvem de Wilson (condensacao branca no primeiro 0,4 s da JDAM e da Mk-82)
wilson=1.0

[debris]
; (experimental, desligado) destrocos lancados para cima e para os lados, com rastro de fumaca e ponta incandescente (JDAM, Mk-82, foguete, tanque)
enabled=0
smoke=1.0
glow=1.0

[color]
; cores aprendidas do video real de JDAM: bola de fogo amarelo-branca curta (0-0,4 s), depois fogo vermelho-escuro
; escondido na fumaca, fuligem mais preta/azulada. 0 = cores da v1.0, 1 = v1.0b (pode usar valores no meio)
realism=1.0
; luz do fogo refletida na fumaca (reflexo rosado embaixo). v1.0 = 1.0
firelight=1.6
